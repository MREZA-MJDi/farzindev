name: Farzin CI

on:
  push:
    branches:
      - main
      - feature/farzin-storefront-rebrand
      - fix/farzin-home-production-2026-10-20
      - fix/farzin-home-final-2026-10-20
      - fix/farzin-home-release-2026-10-20
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Laravel tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, gd, curl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: cp .env.example .env

      - name: Prepare application key
        run: php artisan key:generate

      - name: Install npm dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Run Laravel tests
        run: php artisan test

      - name: Smoke-test the Farzin seed catalogue
        run: |
          touch database/catalog-smoke.sqlite
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php artisan migrate:fresh --force
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php artisan db:seed --class=CategorySeeder --force
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php artisan db:seed --class=ProductSeeder --force
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php artisan db:seed --class=ProductImageSeeder --force
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $products = App\Models\Product::where("sku", "like", "FZ-SEED-%")->count();
          $images = App\Models\ProductImage::whereHas("product", fn ($query) => $query->where("sku", "like", "FZ-SEED-%"))->count();
          if ($products !== 50 || $images !== 50) { throw new RuntimeException("Seed smoke test failed: " . $products . " products, " . $images . " images."); }
          echo "Seed smoke test passed: " . $products . " products and " . $images . " images.\n";
          '

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Package cPanel release
        run: |
          zip -qr /tmp/farzin-cpanel-deploy.zip . \
            -x ".git/*" \
               "node_modules/*" \
               "tests/*" \
               ".env" \
               "storage/logs/*" \
               "database/*.sqlite"
          mv /tmp/farzin-cpanel-deploy.zip ./farzin-cpanel-deploy.zip

      - name: Upload cPanel release package
        uses: actions/upload-artifact@v4
        with:
          name: farzin-cpanel-deploy
          path: farzin-cpanel-deploy.zip
          if-no-files-found: error
          retention-days: 7
