name: Farzin CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Laravel tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, gd, curl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: cp .env.example .env

      - name: Prepare application key
        run: php artisan key:generate

      - name: Install npm dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Run Laravel tests
        run: php artisan test

      - name: Verify production cache commands
        run: |
          php artisan config:cache
          php artisan config:clear
          php artisan route:cache
          php artisan route:clear
          php artisan view:cache
          php artisan view:clear

      - name: Smoke-test the full Farzin database seeder
        run: |
          touch database/catalog-smoke.sqlite
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php artisan migrate:fresh --force
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php artisan db:seed --force
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $products = App\Models\Product::where("sku", "like", "FZ-SEED-%")->count();
          $images = App\Models\ProductImage::whereHas("product", fn ($query) => $query->where("sku", "like", "FZ-SEED-%"))->count();
          $admins = App\Models\User::where("role", "admin")->count();
          if ($products !== 50 || $images !== 0 || $admins < 1) { throw new RuntimeException("Seed smoke test failed: " . $products . " products, " . $images . " placeholder images, " . $admins . " admins."); }
          App\Models\Product::where("sku", "FZ-SEED-HOOD-01")->update(["name" => "Edited by dashboard"]);
          App\Models\Category::where("slug", "hoods")->update(["name" => "Edited category by dashboard", "is_active" => false, "sort_order" => 8]);
          $admin = App\Models\User::where("role", "admin")->orderBy("id")->firstOrFail();
          $admin->update(["password" => Illuminate\Support\Facades\Hash::make("manually-rotated-password")]);
          echo "Full database seed passed: preview catalogue and admin created.\n";
          '
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php artisan db:seed --force
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $products = App\Models\Product::where("sku", "like", "FZ-SEED-%")->count();
          $images = App\Models\ProductImage::whereHas("product", fn ($query) => $query->where("sku", "like", "FZ-SEED-%"))->count();
          $name = App\Models\Product::where("sku", "FZ-SEED-HOOD-01")->value("name");
          $category = Illuminate\Support\Facades\DB::table("categories")->where("slug", "hoods")->first();
          $admin = App\Models\User::where("role", "admin")->orderBy("id")->firstOrFail();
          if (
              $products !== 50
              || $images !== 0
              || $name !== "Edited by dashboard"
              || ! $category
              || $category->name !== "Edited category by dashboard"
              || (int) $category->is_active !== 0
              || (int) $category->sort_order !== 8
              || ! Illuminate\Support\Facades\Hash::check("manually-rotated-password", $admin->password)
          ) { throw new RuntimeException("Repeat seeding changed or duplicated existing catalogue/admin data."); }
          echo "Repeat seed passed: product/category edits and admin password are preserved.\n";
          '

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Package VPS release
        run: |
          test -f vendor/autoload.php
          test -f public/build/manifest.json
          test -f .env.example
          zip -qr /tmp/farzin-vps-release.zip . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "tests/*" \
               ".env" \
               "storage/logs/*" \
               "database/*.sqlite"
          if unzip -Z1 /tmp/farzin-vps-release.zip | grep -Eq '(^|/)\.env$|database/.*\.sqlite|storage/logs/'; then
            echo "Release archive contains environment, SQLite, or log files."
            exit 1
          fi
          mv /tmp/farzin-vps-release.zip ./farzin-vps-release.zip

      - name: Upload VPS release package
        uses: actions/upload-artifact@v4
        with:
          name: farzin-vps-release
          path: farzin-vps-release.zip
          if-no-files-found: error
          retention-days: 7
