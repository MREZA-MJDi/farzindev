name: Farzin CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Laravel tests and production build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, pdo_sqlite, sqlite3, fileinfo, gd, curl, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve PHP dependencies and the pure-PHP IMAP client
        run: composer update 'symfony/*' webklex/php-imap --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Commit refreshed Composer lockfile to the PR branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "Update pure-PHP IMAP dependency [skip ci]"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

      - name: Prepare application environment
        run: cp .env.example .env

      - name: Prepare application key
        run: php artisan key:generate

      - name: Install npm dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Validate VPS deployment helpers
        run: |
          bash -n scripts/repair-vps-permissions.sh scripts/artisan-as-deploy.sh scripts/restore-vps-runtime.sh
          chmod 2770 bootstrap/cache

      - name: Run Laravel tests
        run: php artisan test

      - name: Responsive browser smoke tests
        env:
          APP_ENV: local
          APP_DEBUG: "false"
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/browser-smoke.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: file
          QUEUE_CONNECTION: sync
        run: |
          touch "$DB_DATABASE"
          php artisan migrate:fresh --force
          ADMIN_EMAIL=browser-admin@example.test ADMIN_PASSWORD=browser-smoke-password php artisan db:seed --force
          php artisan db:seed --class=BrowserSmokeSeeder --force
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upload browser traces after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: farzin-browser-smoke-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify production cache commands
        run: |
          php artisan config:cache
          php artisan config:clear
          php artisan route:cache
          php artisan route:clear
          php artisan view:cache
          php artisan view:clear

      - name: Smoke-test the full Farzin database seeder
        run: |
          touch database/catalog-smoke.sqlite
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php artisan migrate:fresh --force
          ADMIN_EMAIL=ci-admin@example.test ADMIN_PASSWORD=ci-only-strong-password-2026 APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php artisan db:seed --force
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $products = App\Models\Product::where("sku", "like", "FZ-SEED-%")->count();
          $images = App\Models\ProductImage::whereHas("product", fn ($query) => $query->where("sku", "like", "FZ-SEED-%"))->count();
          $admins = App\Models\User::where("role", "admin")->count();
          if ($products !== 50 || $images !== 0 || $admins < 1) { throw new RuntimeException("Seed smoke test failed: " . $products . " products, " . $images . " placeholder images, " . $admins . " admins."); }
          App\Models\Product::where("sku", "FZ-SEED-HOOD-01")->update(["name" => "Edited by dashboard"]);
          App\Models\Category::where("slug", "hoods")->update(["name" => "Edited category by dashboard", "is_active" => false, "sort_order" => 8]);
          $admin = App\Models\User::where("role", "admin")->orderBy("id")->firstOrFail();
          $admin->update(["password" => Illuminate\Support\Facades\Hash::make("manually-rotated-password")]);
          echo "Full database seed passed: preview catalogue and admin created.\n";
          '
          ADMIN_EMAIL=ci-admin@example.test ADMIN_PASSWORD=ci-only-strong-password-2026 APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php artisan db:seed --force
          APP_ENV=local DB_CONNECTION=sqlite DB_DATABASE="$PWD/database/catalog-smoke.sqlite" php -r '
          require "vendor/autoload.php";
          $app = require "bootstrap/app.php";
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $products = App\Models\Product::where("sku", "like", "FZ-SEED-%")->count();
          $images = App\Models\ProductImage::whereHas("product", fn ($query) => $query->where("sku", "like", "FZ-SEED-%"))->count();
          $name = App\Models\Product::where("sku", "FZ-SEED-HOOD-01")->value("name");
          $category = Illuminate\Support\Facades\DB::table("categories")->where("slug", "hoods")->first();
          $admin = App\Models\User::where("role", "admin")->orderBy("id")->firstOrFail();
          if (
              $products !== 50
              || $images !== 0
              || $name !== "Edited by dashboard"
              || ! $category
              || $category->name !== "Edited category by dashboard"
              || (int) $category->is_active !== 0
              || (int) $category->sort_order !== 8
              || ! Illuminate\Support\Facades\Hash::check("manually-rotated-password", $admin->password)
          ) { throw new RuntimeException("Repeat seeding changed or duplicated existing catalogue/admin data."); }
          echo "Repeat seed passed: product/category edits and admin password are preserved.\n";
          '

      - name: Install production Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Package VPS release
        run: |
          test -f vendor/autoload.php
          test -f public/build/manifest.json
          test -f .env.example
          zip -qr /tmp/farzin-vps-release.zip . \
            -x ".git/*" \
               ".github/*" \
               "node_modules/*" \
               "tests/*" \
               ".env" \
               "storage/logs/*" \
               "database/*.sqlite" \
               "playwright.config.js" \
               "test-results/*"
          if unzip -Z1 /tmp/farzin-vps-release.zip | grep -Eq '(^|/)\.env$|database/.*\.sqlite|storage/logs/'; then
            echo "Release archive contains environment, SQLite, or log files."
            exit 1
          fi
          mv /tmp/farzin-vps-release.zip ./farzin-vps-release.zip

      - name: Upload VPS release package
        uses: actions/upload-artifact@v4
        with:
          name: farzin-vps-release
          path: farzin-vps-release.zip
          if-no-files-found: error
          retention-days: 7
